# Alembic config for the onboard database. Run from the onboard/ folder:
#   uv run alembic upgrade heads
# The database URL comes from ONBOARD_DATABASE_URL (see migrations/env.py), not from here.
#
# Each owner has an independent migration branch in its own folder, so the three can
# add migrations in parallel without "multiple heads" conflicts (see migrations/README.md).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = space
version_locations = %(here)s/migrations/versions/observations %(here)s/migrations/versions/ingest %(here)s/migrations/versions/sync
# Date prefix keeps files in creation order inside each folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

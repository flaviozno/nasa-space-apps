[project]
name = "onboard"
version = "0.1.0"
description = "Onboard service: wearable ingest, Crew API, alerts and the Outbox to Earth."
requires-python = ">=3.12"
dependencies = [
    "hub-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.sources]
hub-common = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

name: Publicar emulador wearable

on:
  push:
    branches: [main]
    paths:
      - 'emu/**'
      - '.github/workflows/deploy-emu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-emu-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: '39.1.0'

jobs:
  deploy:
    name: Validar e publicar o emu
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: emu
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: emu/package-lock.json

      - name: Instalar dependências e validar tipos
        run: |
          npm ci
          npm run typecheck

      - name: Instalar Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Obter configuração de produção da Vercel
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Preparar deployment
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publicar em produção
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

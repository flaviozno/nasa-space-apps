# uv workspace for the Python services. Run `uv sync` here once; each service
# runs from its own folder (see readme.md, "Running locally").
[project]
name = "health-hub-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "onboard", "earth"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

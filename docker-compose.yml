# Local and VPS stack: `docker compose up --build` from this folder.
# The wearable emulator runs on Vercel (emu/), not here.
name: health-hub

x-python-healthcheck: &python-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 10s
  timeout: 3s
  retries: 5

x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  # Separate PostgreSQL instances keep onboard and Earth data apart (readme.md, section 7):
  # data reaches Earth only through the Outbox.
  onboard-db:
    <<: *postgres
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: ${ONBOARD_DB_PASSWORD:-onboard}
      POSTGRES_DB: onboard
    volumes:
      - onboard-pgdata:/var/lib/postgresql/data
    # Published on localhost only, for running the service or Alembic outside Docker.
    ports:
      - "127.0.0.1:${ONBOARD_DB_PORT:-5433}:5432"

  earth-db:
    <<: *postgres
    environment:
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: ${EARTH_DB_PASSWORD:-earth}
      POSTGRES_DB: earth
    volumes:
      - earth-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EARTH_DB_PORT:-5434}:5432"

  onboard:
    build:
      context: .
      dockerfile: onboard/Dockerfile
    environment:
      ONBOARD_DATABASE_URL: postgresql+psycopg://onboard:${ONBOARD_DB_PASSWORD:-onboard}@onboard-db:5432/onboard
      ONBOARD_SIMULATOR_URL: ${SIMULATOR_URL:-}
      ONBOARD_SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-}
      ONBOARD_EARTH_URL: http://earth:8000
      ONBOARD_EARTH_INGEST_TOKEN: ${EARTH_INGEST_TOKEN:-}
      ONBOARD_ADMIN_TOKEN: ${ONBOARD_ADMIN_TOKEN:-}
    depends_on:
      onboard-db:
        condition: service_healthy
    # Bound to localhost only: public traffic goes through the web container.
    ports:
      - "127.0.0.1:${ONBOARD_PORT:-8001}:8000"
    healthcheck: *python-healthcheck
    restart: unless-stopped

  earth:
    build:
      context: .
      dockerfile: earth/Dockerfile
    environment:
      EARTH_DATABASE_URL: postgresql+psycopg://earth:${EARTH_DB_PASSWORD:-earth}@earth-db:5432/earth
      EARTH_INGEST_TOKEN: ${EARTH_INGEST_TOKEN:-}
    depends_on:
      earth-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EARTH_PORT:-8002}:8000"
    healthcheck: *python-healthcheck
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      onboard:
        condition: service_healthy
      earth:
        condition: service_healthy
    restart: unless-stopped

volumes:
  onboard-pgdata:
  earth-pgdata:

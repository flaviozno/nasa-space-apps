# Serves the built web app and proxies the APIs it calls (same paths as vite.config.ts).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve container names through Docker's DNS. With a literal host in proxy_pass,
    # nginx resolves it once at startup; after `docker compose restart onboard` the old
    # IP may belong to another container, and requests silently go to the wrong service.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $onboard_upstream http://onboard:8000;
    set $earth_upstream http://earth:8000;

    # proxy_pass with a variable does not strip the prefix, hence the rewrites.
    location /api/onboard/ {
        rewrite ^/api/onboard/(.*)$ /$1 break;
        proxy_pass $onboard_upstream;
    }

    # Only Earth's health and read endpoints are public; /v1/events (ingest) stays private.
    location = /api/earth/health {
        rewrite ^ /health break;
        proxy_pass $earth_upstream;
    }
    location /api/earth/v1/views/ {
        rewrite ^/api/earth/(.*)$ /$1 break;
        proxy_pass $earth_upstream;
    }

    # Any other API path (e.g. Earth ingest) is not public; answer 404 instead of the SPA HTML.
    location /api/ {
        return 404;
    }

    # Client-side routes (/crew/:id, /earth) fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}

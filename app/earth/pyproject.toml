[project]
name = "earth"
version = "0.1.0"
description = "Earth service: idempotent event ingest from onboard and read endpoints for the Earth view."
requires-python = ">=3.12"
dependencies = [
    "hub-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
hub-common = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

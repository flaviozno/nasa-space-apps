# Alembic config for the Earth database. Run from the earth/ folder:
#   uv run alembic upgrade heads
# The database URL comes from EARTH_DATABASE_URL (see migrations/env.py), not from here.
# Single linear branch: create migrations with `uv run alembic revision -m "..."`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = space
version_locations = %(here)s/migrations/versions
# Date prefix keeps files in creation order inside each folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
